@if (isLoading) {
  <div class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center app-loading-overlay">
    <div class="spinner-border text-white" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    @if (message) {
      <p class="text-white mt-3">{{ message }}</p>
    }
  </div>
}
