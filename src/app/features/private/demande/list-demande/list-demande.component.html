  <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-list-check"></i> Mes Demandes de RV</h1>
            <a href="demande-rv.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nouvelle Demande</a>
        </div>

        <!-- Filter Section -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="filterStatus" class="form-label">Filtrer par statut</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Tous les statuts</option>
                            <option value="en_attente">En attente</option>
                            <option value="accepte">Acceptée</option>
                            <option value="refuse">Refusée</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="filterSpecialite" class="form-label">Filtrer par spécialité</label>
                        <select class="form-select" id="filterSpecialite">
                            <option value="">Toutes les spécialités</option>
                            <option value="Generaliste">Médecin Généraliste</option>
                            <option value="Cardiologue">Cardiologue</option>
                            <option value="Dermatologue">Dermatologue</option>
                        </select>
                    </div>
                   
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th><i class="bi bi-person"></i> Patient</th>
                            <th><i class="bi bi-stethoscope"></i> Spécialité</th>
                            <th><i class="bi bi-calendar"></i> Date Demandée</th>
                            <th><i class="bi bi-clock"></i> Heure</th>
                            <th><i class="bi bi-info-circle"></i> Statut</th>
                           
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                        <i class="bi bi-person"></i>
                                    </div>
                                    <div class="ms-2">
                                        <strong>Jean Dupont</strong><br>
                                        <small class="text-muted">PAT-001</small>
                                    </div>
                                </div>
                            </td>
                            <td>Cardiologue</td>
                            <td>25/01/2026</td>
                            <td>14:30</td>
                            <td>
                                <app-status-badge status="en_attente"></app-status-badge>
                            </td>
                            
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <app-pagination 
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          (pageChanged)="onPageChange($event)">
        </app-pagination>
    </div>
