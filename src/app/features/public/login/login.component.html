 <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card login-card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-25 p-3 rounded-circle d-inline-block mb-3">
                        <i class="bi bi-hospital" style="font-size: 3rem; color: #0d6efd;"></i>
                    </div>
                    <p class="text-muted small">Bienvenue sur</p>
                    <p class="text-primary fw-bold">Système de Gestion de Rendez-vous Médicaux</p>
                </div>
                
                <h2 class="text-center mb-4">Se connecter</h2>
                
                <form action="dashboard.html">
                    <div class="mb-3">
                        <label for="username" class="form-label">Login</label>
                        <input type="text" class="form-control" id="username" placeholder="Email ou nom d'utilisateur" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
                    </div>
                    
                    <div class="text-end mb-3">
                        <a href="#" class="text-decoration-none small text-primary">Mot de passe oublié?</a>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary text-white">Se connecter</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">Pas encore inscrit? <a href="#" class="text-primary text-decoration-none">S'inscrire</a></p>
                </div>
            </div>
        </div>
    </div>
