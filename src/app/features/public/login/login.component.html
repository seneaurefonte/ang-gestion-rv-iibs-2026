 <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card login-card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-25 p-3 rounded-circle d-inline-block mb-3">
                        <i class="bi bi-hospital" style="font-size: 3rem; color: #0d6efd;"></i>
                    </div>
                    <p class="text-muted small">Bienvenue sur</p>
                    <p class="text-primary fw-bold">Système de Gestion de Rendez-vous Médicaux</p>
                </div>
                
                <h2 class="text-center mb-4">Se connecter</h2>
                
                <!-- Message d'erreur -->
                <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ errorMessage }}
                    <button type="button" class="btn-close" (click)="errorMessage = null"></button>
                </div>
                
                <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email"
                            [(ngModel)]="email"
                            placeholder="Entrez votre email" 
                            email
                            required
                            [class.is-invalid]="isFieldInvalid('email', loginForm)">
                        <div class="invalid-feedback" *ngIf="isFieldInvalid('email', loginForm)">
                            <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis</span>
                            <span *ngIf="loginForm.get('email')?.errors?.['email']">Veuillez entrer un email valide</span>
                        </div>
                    </div>
                    
                    <!-- Mot de passe -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password"
                            [(ngModel)]="password"
                            placeholder="Entrez votre mot de passe" 
                            minlength="6"
                            required
                            [class.is-invalid]="isFieldInvalid('password', loginForm)">
                        <div class="invalid-feedback" *ngIf="isFieldInvalid('password', loginForm)">
                            <span *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis</span>
                            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</span>
                        </div>
                    </div>
                    
                    <div class="text-end mb-3">
                        <a href="#" class="text-decoration-none small text-primary">Mot de passe oublié?</a>
                    </div>
                    
                    <!-- Bouton de connexion -->
                    <div class="d-grid gap-2">
                        <button 
                            type="submit" 
                            class="btn btn-primary text-white"
                            [disabled]="loginForm.invalid || isLoading">>
                            <span *ngIf="!isLoading">Se connecter</span>
                            <span *ngIf="isLoading">
                                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Connexion en cours...
                            </span>
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">Pas encore inscrit? <a href="#" class="text-primary text-decoration-none">S'inscrire</a></p>
                </div>
            </div>
        </div>
    </div>
